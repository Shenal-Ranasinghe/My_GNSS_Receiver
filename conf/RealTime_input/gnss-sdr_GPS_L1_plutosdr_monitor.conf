; Lightweight realtime monitor config for ADALM-PLUTO (safe default)
; Use Ad936x_Custom_Signal_Source to avoid known volk/gr-iio templated crashes
; Edit `SignalSource.pluto_uri` if your Pluto uses a different address/interface

[GNSS-SDR]

GNSS-SDR.internal_fs_sps=4000000
GNSS-SDR.use_acquisition_resampler=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=Ad936x_Custom_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.pluto_uri=ip:192.168.2.1
SignalSource.sampling_frequency=4000000
SignalSource.freq=1575420000
SignalSource.bandwidth=2000000
SignalSource.gain_mode=slow_attack
SignalSource.gain=40
SignalSource.samples=0
SignalSource.buffer_size=65536
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.dump_filename=./capture.dat

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8
Channels_1B.count=0
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.use_CFAR_algorithm=false
Acquisition_1C.threshold=2.6
Acquisition_1C.doppler_max=50000
Acquisition_1C.doppler_step=250

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.dump=false
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.enable_fll_pull_in=true

;######### PVT CONFIG (NMEA output for live monitoring) ############
PVT.implementation=RTKLIB_PVT
PVT.enable_rx_clock_correction=false
PVT.positioning_mode=Single
PVT.output_rate_ms=1000
PVT.rinexobs_rate_ms=1000
PVT.display_rate_ms=1000
PVT.dump=true
PVT.nmea_dump_filename=gnss_sdr_pvt.nmea
PVT.flag_nmea_tty_port=false

;######### TELEMETRY DECODERS ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false
TelemetryDecoder_1B.implementation=Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_1B.dump=false

;######### OBSERVABLES and logging ############
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat
